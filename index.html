<style>
  :root{
    --bg:#0b141a; --panel:#202c33; --input:#2a3942; --sent:#005c4b; --recv:#202c33;
    --text:#e9edef; --muted:#8696a0; --accent:#00a884; --blue:#53bdeb; --danger:#f15c6d;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali","Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
  .hidden{display:none !important}

  /* ---------- Login ---------- */
  #login{height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
  #login form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px}
  #login input{width:100%;padding:14px 16px;border-radius:10px;border:1px solid transparent;
    background:var(--input);color:var(--text);font-size:16px;outline:none}
  #login input:focus{border-color:var(--accent)}
  #login button{padding:14px;border:0;border-radius:10px;background:var(--accent);color:#06130f;
    font-size:16px;font-weight:600;cursor:pointer}
  #login button:disabled{opacity:.6;cursor:default}
  #loginError{color:var(--danger);font-size:14px;text-align:center;min-height:0}

  /* ---------- Chat ---------- */
  #chat{height:100dvh;display:flex;flex-direction:column;max-width:900px;margin:0 auto;
    background:var(--bg);border-left:1px solid #111b21;border-right:1px solid #111b21}
  header{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--panel);
    padding-top:max(10px,env(safe-area-inset-top))}
  header .logo{width:38px;height:38px;border-radius:50%;background:#fff;display:flex;
    align-items:center;justify-content:center;flex:none}
  header .logo svg{width:24px;height:24px}
  header .info{flex:1;min-width:0}
  header .name{font-weight:600;font-size:16px}
  header .status{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header button{background:transparent;border:1px solid #3b4a54;color:var(--muted);border-radius:8px;
    padding:7px 12px;font-size:13px;cursor:pointer}
  header button:hover{color:var(--text)}

  /* message area + big K❤T background */
  .msgwrap{flex:1;position:relative;min-height:0;background-color:var(--bg);
    background-image:radial-gradient(rgba(255,255,255,.02) 1px,transparent 1px);background-size:18px 18px;
    overflow:hidden}
  .watermark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    gap:.02em;pointer-events:none;user-select:none;-webkit-user-select:none;
    font-weight:800;font-size:min(38vw,330px);line-height:1;letter-spacing:-.03em;
    color:#e9edef;opacity:.075}
  .watermark svg{width:.78em;height:.78em;flex:none;fill:#ff4d6d}
  #messages{position:absolute;inset:0;overflow-y:auto;padding:14px 10px;display:flex;
    flex-direction:column;gap:4px;background:transparent}

  .empty{margin:auto;color:var(--muted);font-size:14px}
  .row{display:flex}
  .row.me{justify-content:flex-end}
  .bubble{max-width:78%;padding:6px 9px 5px;border-radius:9px;position:relative;
    box-shadow:0 1px 0.5px rgba(0,0,0,.35);word-wrap:break-word;overflow-wrap:anywhere;
    -webkit-touch-callout:none}
  .me .bubble{background:var(--sent);border-top-right-radius:2px}
  .them .bubble{background:var(--recv);border-top-left-radius:2px}
  .sender{font-size:12.5px;font-weight:600;margin-bottom:2px}
  .text{font-size:15px;line-height:1.35;white-space:pre-wrap}
  .meta{display:flex;align-items:center;justify-content:flex-end;gap:6px;margin-top:3px;
    font-size:11px;color:rgba(233,237,239,.6);flex-wrap:wrap}
  .tick{font-size:12px;letter-spacing:-2px}
  .tick.seen{color:var(--blue)}
  .timer{background:rgba(0,0,0,.28);padding:1px 6px;border-radius:8px;font-size:10.5px;color:#ffd479}
  .del{background:transparent;border:0;color:var(--danger);font-size:11px;cursor:pointer;
    padding:1px 4px;text-decoration:underline}
  .reactbtn{background:transparent;border:0;color:rgba(233,237,239,.55);cursor:pointer;
    font-size:14px;padding:0 3px;line-height:1}
  .reactbtn:hover{color:var(--text)}

  /* reactions */
  .reacts{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
  .chip{display:inline-flex;align-items:center;gap:3px;background:rgba(0,0,0,.3);

  #picker{position:fixed;z-index:50;background:#233138;border-radius:28px;padding:6px 8px;

  #picker.expanded{border-radius:16px;flex-wrap:wrap;width:min(330px,calc(100vw - 16px));

  #sendBtn{width:46px;height:46px;border-radius:50%;border:0;background:var(--accent);cursor:pointer;
    display:flex;align-items:center;justify-content:center;flex:none}
  #sendBtn svg{width:22px;height:22px;fill:#06130f}

  /* photos */
  #attachBtn{width:42px;height:46px;border:0;background:transparent;color:var(--muted);cursor:pointer;
    display:flex;align-items:center;justify-content:center;flex:none}
  #attachBtn:hover{color:var(--text)}
  #attachBtn svg{width:26px;height:26px;fill:currentColor}
  #preview{display:flex;align-items:center;gap:12px;padding:8px 12px;background:var(--panel);
    border-top:1px solid #111b21}
  #preview img{max-height:90px;max-width:60%;border-radius:8px;object-fit:cover}
  #preview button{background:var(--input);border:0;color:var(--text);width:30px;height:30px;
    border-radius:50%;cursor:pointer;font-size:14px}
  .pic{display:block;max-width:min(70vw,320px);max-height:320px;width:auto;height:auto;
    object-fit:cover;border-radius:6px;margin-bottom:4px;cursor:zoom-in;background:rgba(0,0,0,.25)}
  .dlbtn{background:transparent;border:0;color:rgba(233,237,239,.7);cursor:pointer;
    font-size:13px;padding:0 3px;line-height:1}
  .dlbtn:hover{color:var(--text)}
  #viewer{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.93);display:flex;
    flex-direction:column;align-items:center;justify-content:center;padding:12px}
  #viewer .vbar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:flex-end;gap:10px;
    padding:max(12px,env(safe-area-inset-top)) 14px 12px}
  #viewer .vbar button{background:#2a3942;border:0;color:var(--text);padding:9px 16px;
    border-radius:20px;font-size:14px;cursor:pointer}
  #viewer img{max-width:100%;max-height:82vh;object-fit:contain;border-radius:4px}
</style>

const EXPIRE_MS = 10 * 60 * 1000;   // 10 minutes after seen

/* ---------- Google "G" icon (inline SVG) ---------- */
const G_SVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">' +

const G_URI = "data:image/svg+xml," + encodeURIComponent(G_SVG);

document.getElementById("favicon").href = G_URI;
document.getElementById("headerLogo").innerHTML = G_SVG;

/* ---------- Dynamic PWA manifest ---------- */
function makePng(size){
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas");
      c.width = c.height = size;
      const x = c.getContext("2d");
      x.fillStyle = "#ffffff";
      x.fillRect(0, 0, size, size);
      const pad = size * 0.16;
      x.drawImage(img, pad, pad, size - pad * 2, size - pad * 2);
      resolve(c.toDataURL("image/png"));
    };
    img.onerror = () => resolve(null);
    img.src = G_URI;
  });
}
async function setupManifest(){
  try{
    const [p192, p512] = await Promise.all([makePng(192), makePng(512)]);
    const icons = [];
    if (p192) icons.push({ src: p192, sizes: "192x192", type: "image/png", purpose: "any maskable" });
    if (p512) icons.push({ src: p512, sizes: "512x512", type: "image/png", purpose: "any maskable" });
    icons.push({ src: G_URI, sizes: "any", type: "image/svg+xml", purpose: "any" });
    const base = location.href.split("#")[0].split("?")[0];
    const manifest = {
      name: "KT", short_name: "KT",
      id: base, start_url: base, scope: base.replace(/[^/]*$/, ""),
      display: "standalone", orientation: "any",
      background_color: "#0b141a", theme_color: "#202c33",
      icons
    };
    const blob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
    document.getElementById("manifest-link").href = URL.createObjectURL(blob);
  }catch(e){ /* manifest is optional */ }
}
setupManifest();

/* ---------- Service worker (needed for Android notifications; file: sw.js) ---------- */
if ("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}

/* ---------- DOM refs ---------- */
const $ = id => document.getElementById(id);
const loginView = $("login"), chatView = $("chat");
const loginForm = $("loginForm"), loginBtn = $("loginBtn"), loginError = $("loginError");
const messagesEl = $("messages"), statusEl = $("status"), pickerEl = $("picker");

function showLoginError(msg){ loginError.textContent = msg || ""; }

/* ---------- Config check ---------- */
const configMissing = Object.values(firebaseConfig).some(v => !v || String(v).includes("PASTE_"));
let app, auth, db;
if (!configMissing){
  app  = initializeApp(firebaseConfig);
  auth = getAuth(app);
  db   = getFirestore(app);
}

/* ---------- Helpers ---------- */
function toEmail(input){
  const u = input.trim().toLowerCase();
  if (u === ADMIN_USERNAME) return ADMIN_EMAIL;
  if (u.includes("@")) return u;
  return u + "@privatechat.local";
}
function nameFromEmail(email){
  const n = (email || "").split("@")[0];
  return n || "user";
}
function isAdminUser(u){
  if (!u) return false;
  return u.uid === ADMIN_UID ||
         (u.email || "").toLowerCase() === ADMIN_EMAIL ||
         nameFromEmail(u.email) === ADMIN_USERNAME;
}
function fmtTime(ms){
  return new Date(ms).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}
function fmtRemain(ms){
  const s = Math.max(0, Math.ceil(ms / 1000));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
const COLORS = ["#53bdeb","#ffb86b","#c792ea","#7fdc8f","#ff8fa3","#f7d774","#6fd3c9"];
function colorFor(name){
  let h = 0; for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return COLORS[h % COLORS.length];
}

/* ---------- Notifications + sound ---------- */
let actx = null, notifIcon = null, unread = 0;

function initAudio(){
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
  }catch(e){}
}
function beep(){
  try{
    if (!actx) return;
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.type = "sine"; o.frequency.value = 880;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.15, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + 0.26);
  }catch(e){}
}
function askNotifPermission(){
  try{
    if ("Notification" in window && Notification.permission === "default"){
      Notification.requestPermission();
    }
  }catch(e){}
}
async function showNotif(title, body, tag){
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  if (!notifIcon) notifIcon = await makePng(192);
  const opts = { body, tag, renotify: true, vibrate: [150, 80, 150] };
  if (notifIcon){ opts.icon = notifIcon; opts.badge = notifIcon; }
  try{
    const reg = "serviceWorker" in navigator ? await navigator.serviceWorker.getRegistration() : null;
    if (reg && reg.showNotification){ await reg.showNotification(title, opts); return; }
  }catch(e){}
  try{ new Notification(title, opts); }catch(e){}
}
function updateTitle(){ document.title = unread > 0 ? "(" + unread + ") KT" : "KT"; }
function isActive(){ return document.visibilityState === "visible" && document.hasFocus(); }
function onIncoming(id, d){
  if (isActive()){ beep(); return; }
  unread++; updateTitle();
  const body = d.image ? ("📷 " + (d.text || "Photo")) : (d.text || "");
  showNotif(d.username || "KT", body, "kt-" + id);
}
function onBecameActive(){
  if (document.visibilityState === "visible"){
    unread = 0; updateTitle();
    markSeen();
  }
}
document.addEventListener("visibilitychange", onBecameActive);
window.addEventListener("focus", onBecameActive);
document.addEventListener("pointerdown", initAudio, { once: true });

/* ---------- Login ---------- */
loginForm.addEventListener("submit", async e => {
  e.preventDefault();
  askNotifPermission();   // must run inside the tap/click
  initAudio();
  showLoginError("");
  if (configMissing){ showLoginError("Firebase config missing."); return; }
  const username = $("username").value;
  const password = $("password").value;
  if (!username.trim() || !password) return;
  loginBtn.disabled = true;
  try{
    await signInWithEmailAndPassword(auth, toEmail(username), password);
  }catch(err){
    showLoginError("Login failed.");
  }finally{
    loginBtn.disabled = false;
  }
});

$("logoutBtn").addEventListener("click", () => { if (auth) signOut(auth); });

/* ---------- Chat state ---------- */
let currentUser = null, isAdmin = false;
let unsub = null, timerId = null, firstSnap = true;
let messages = [];                 // [{id, ...data}]
const deleting = new Set();        // ids with a delete in flight
const marking  = new Set();        // ids with a seen-update in flight

if (auth){
  onAuthStateChanged(auth, user => {
    if (user){
      currentUser = user;
      isAdmin = isAdminUser(user);
      statusEl.textContent = nameFromEmail(user.email) + (isAdmin ? " (Admin)" : "") + " • online";
      loginView.classList.add("hidden");
      chatView.classList.remove("hidden");
      $("password").value = "";
      startChat();
    }else{
      currentUser = null; isAdmin = false;
      stopChat();
      chatView.classList.add("hidden");
      loginView.classList.remove("hidden");
    }
  });
}

function startChat(){
  stopChat();
  firstSnap = true;
  const q = query(collection(db, "messages"), orderBy("createdAt", "asc"));
  unsub = onSnapshot(q, snap => {
    const wasFirst = firstSnap;
    firstSnap = false;
    messages = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (!wasFirst){
      snap.docChanges().forEach(ch => {
        if (ch.type === "added" && !ch.doc.metadata.hasPendingWrites){
          const d = ch.doc.data();
          if (d.uid !== currentUser.uid) onIncoming(ch.doc.id, d);
        }
      });
    }
    render();
    markSeen();
    purgeExpired();
  }, err => {
    statusEl.textContent = "Connection error";
  });
  timerId = setInterval(tick, CHECK_MS);
}
function stopChat(){
  if (unsub){ unsub(); unsub = null; }
  if (timerId){ clearInterval(timerId); timerId = null; }
  messages = [];
  messagesEl.innerHTML = "";
  closePicker();
  closeViewer();
  clearPending();
  unread = 0; updateTitle();
}

/* ---------- Reactions ---------- */
async function setReaction(id, emoji){
  if (!currentUser) return;
  const m = messages.find(x => x.id === id);
  if (!m) return;
  const cur = m.reactions && m.reactions[currentUser.uid] && m.reactions[currentUser.uid].e;
  const path = "reactions." + currentUser.uid;
  try{
    if (cur === emoji){
      await updateDoc(doc(db, "messages", id), { [path]: deleteField() });
    }else{
      await updateDoc(doc(db, "messages", id), { [path]: { e: emoji, n: nameFromEmail(currentUser.email) } });
    }
  }catch(e){
    statusEl.textContent = "Reaction failed";
  }
}

let pickerId = null, pickerAnchor = null;
function buildPicker(expanded){
  pickerEl.innerHTML = "";
  pickerEl.classList.toggle("expanded", expanded);
  const list = expanded ? QUICK_EMOJI.concat(MORE_EMOJI) : QUICK_EMOJI;
  for (const em of list){
    const b = document.createElement("button");
    b.type = "button"; b.textContent = em;
    b.addEventListener("click", () => { const id = pickerId; closePicker(); setReaction(id, em); });
    pickerEl.appendChild(b);
  }
  if (!expanded){
    const more = document.createElement("button");
    more.type = "button"; more.textContent = "＋"; more.style.fontSize = "22px";
    more.addEventListener("click", () => { buildPicker(true); placePicker(); });
    pickerEl.appendChild(more);
  }
}
function placePicker(){
  if (!pickerAnchor) return;
  const r = pickerAnchor.getBoundingClientRect();
  const pw = pickerEl.offsetWidth, ph = pickerEl.offsetHeight;
  let top = r.top - ph - 8;
  if (top < 8) top = Math.min(r.bottom + 8, window.innerHeight - ph - 8);
  let left = r.left;
  if (left + pw > window.innerWidth - 8) left = window.innerWidth - pw - 8;
  if (left < 8) left = 8;
  pickerEl.style.top = top + "px";
  pickerEl.style.left = left + "px";
}
function openPicker(id, anchor){
  pickerId = id; pickerAnchor = anchor;
  pickerEl.classList.remove("hidden");
  buildPicker(false);
  placePicker();
}
function closePicker(){
  pickerEl.classList.add("hidden");
  pickerId = null; pickerAnchor = null;
}
document.addEventListener("pointerdown", e => {
  if (pickerEl.classList.contains("hidden")) return;
  if (pickerEl.contains(e.target) || e.target.closest(".reactbtn")) return;
  closePicker();
});
messagesEl.addEventListener("scroll", closePicker, { passive: true });
window.addEventListener("resize", closePicker);

/* ---------- Render ---------- */
function render(){
  const nearBottom = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 120;
  const now = Date.now();
  messagesEl.innerHTML = "";
  const visible = messages.filter(m => !(m.seenAt && now - m.seenAt >= EXPIRE_MS));
  if (!visible.length){
    const d = document.createElement("div");
    d.className = "empty"; d.textContent = "No messages yet";
    messagesEl.appendChild(d);
    return;
  }
  for (const m of visible){
    const mine = m.uid === currentUser.uid;
    const row = document.createElement("div");
    row.className = "row " + (mine ? "me" : "them");

    const b = document.createElement("div");
    b.className = "bubble";

    if (!mine){
      const s = document.createElement("div");
      s.className = "sender";
      s.textContent = m.username || "user";
      s.style.color = colorFor(m.username || "user");
      b.appendChild(s);
    }

    if (m.image){
      const im = document.createElement("img");
      im.className = "pic";
      if (m.iw && m.ih){ im.width = m.iw; im.height = m.ih; }
      im.alt = "Photo";
      im.src = m.image;
      im.addEventListener("click", () => openViewer(m));
      b.appendChild(im);
    }
    if (m.text){
      const t = document.createElement("div");
      t.className = "text";
      t.textContent = m.text;
      b.appendChild(t);
    }

    /* reaction chips */
    const groups = {};
    for (const [uid, r] of Object.entries(m.reactions || {})){
      if (!r || !r.e) continue;
      if (!groups[r.e]) groups[r.e] = { names: [], mine: false };
      groups[r.e].names.push(r.n || "user");
      if (uid === currentUser.uid) groups[r.e].mine = true;
    }
    const emojis = Object.keys(groups);
    if (emojis.length){
      const rc = document.createElement("div");
      rc.className = "reacts";
      for (const em of emojis){
        const g = groups[em];
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "chip" + (g.mine ? " mine" : "");
        chip.title = g.names.join(", ");
        chip.textContent = em;
        if (g.names.length > 1){
          const n = document.createElement("small");
          n.textContent = g.names.length;
          chip.appendChild(n);
        }
        chip.addEventListener("click", () => setReaction(m.id, em));
        rc.appendChild(chip);
      }
      b.appendChild(rc);
    }

    const meta = document.createElement("div");
    meta.className = "meta";

    if (m.seenAt){
      const tm = document.createElement("span");
      tm.className = "timer";
      tm.dataset.id = m.id;
      tm.textContent = "⏱ " + fmtRemain(m.seenAt + EXPIRE_MS - now);
      meta.appendChild(tm);
    }

    const rb = document.createElement("button");
    rb.type = "button"; rb.className = "reactbtn"; rb.textContent = "☺";
    rb.title = "React";
    rb.addEventListener("click", ev => { ev.stopPropagation(); openPicker(m.id, b); });
    meta.appendChild(rb);

    if (m.image){
      const dl = document.createElement("button");
      dl.type = "button"; dl.className = "dlbtn"; dl.textContent = "⬇";
      dl.title = "Download photo";
      dl.addEventListener("click", ev => { ev.stopPropagation(); downloadImage(m.image, "KT-" + m.id + ".jpg"); });
      meta.appendChild(dl);
    }

    const time = document.createElement("span");
    time.textContent = fmtTime(m.createdAt || now);
    meta.appendChild(time);

    if (mine){
      const tick = document.createElement("span");
      tick.className = "tick" + (m.seenAt ? " seen" : "");
      tick.textContent = m.seenAt ? "✓✓" : "✓";
      meta.appendChild(tick);
    }

    if (isAdmin){
      const del = document.createElement("button");
      del.className = "del"; del.type = "button"; del.textContent = "Delete";
      del.addEventListener("click", async () => {
        try{ await deleteDoc(doc(db, "messages", m.id)); }catch(e){}
      });
      meta.appendChild(del);
    }

    b.appendChild(meta);

    /* open the picker: double-click, right-click, or long-press */
    b.addEventListener("dblclick", () => openPicker(m.id, b));
    b.addEventListener("contextmenu", ev => { ev.preventDefault(); openPicker(m.id, b); });
    let lp = null;
    const stopLp = () => { if (lp){ clearTimeout(lp); lp = null; } };
    b.addEventListener("touchstart", () => { stopLp(); lp = setTimeout(() => { lp = null; openPicker(m.id, b); }, 450); }, { passive: true });
    b.addEventListener("touchmove", stopLp, { passive: true });
    b.addEventListener("touchend", stopLp, { passive: true });
    b.addEventListener("touchcancel", stopLp, { passive: true });

    row.appendChild(b);
    messagesEl.appendChild(row);
  }
  if (nearBottom) messagesEl.scrollTop = messagesEl.scrollHeight;
}

/* ---------- Seen marking ---------- */
async function markSeen(){
  if (!currentUser || document.visibilityState !== "visible") return;
  for (const m of messages){
    if (m.uid !== currentUser.uid && !m.seenAt && !marking.has(m.id)){
      marking.add(m.id);
      try{ await updateDoc(doc(db, "messages", m.id), { seenAt: Date.now() }); }
      catch(e){ marking.delete(m.id); }
    }
  }
}

/* ---------- Periodic timer + auto-delete ---------- */
async function purgeExpired(){
  const now = Date.now();
  for (const m of messages){
    if (m.seenAt && now - m.seenAt >= EXPIRE_MS && !deleting.has(m.id)){
      deleting.add(m.id);
      try{ await deleteDoc(doc(db, "messages", m.id)); }
      catch(e){ setTimeout(() => deleting.delete(m.id), 15000); }
    }
  }
}
function tick(){
  const now = Date.now();
  let needRender = false;
  for (const m of messages){
    if (!m.seenAt) continue;
    const left = m.seenAt + EXPIRE_MS - now;
    if (left <= 0){ needRender = true; continue; }
    const el = messagesEl.querySelector('.timer[data-id="' + m.id + '"]');
    if (el) el.textContent = "⏱ " + fmtRemain(left);
  }
  if (needRender) render();
  purgeExpired();
  markSeen();
}

/* ---------- Photos: compress, preview, view, download ---------- */
/* Photos are shrunk in the browser and stored inside the Firestore message
   (Firebase Storage needs a paid plan). Each message must stay under 1 MB. */
let pending = null;   // { url, w, h }
const MAX_IMG_CHARS = 700000;

function flash(msg){
  const old = statusEl.textContent;
  statusEl.textContent = msg;
  setTimeout(() => { if (statusEl.textContent === msg) statusEl.textContent = old; }, 3000);
}
function loadImage(file){
  return new Promise((resolve, reject) => {
    const u = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(u); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(u); reject(new Error("load")); };
    img.src = u;
  });
}
async function compressImage(file){
  const img = await loadImage(file);
  let maxDim = 1280, q = 0.72;
  for (let i = 0; i < 10; i++){
    const scale = Math.min(1, maxDim / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.max(1, Math.round(img.naturalWidth * scale));
    const h = Math.max(1, Math.round(img.naturalHeight * scale));
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    const x = c.getContext("2d");
    x.fillStyle = "#ffffff";
    x.fillRect(0, 0, w, h);
    x.drawImage(img, 0, 0, w, h);
    const url = c.toDataURL("image/jpeg", q);
    if (url.length <= MAX_IMG_CHARS) return { url, w, h };
    if (q > 0.45) q -= 0.1; else maxDim = Math.round(maxDim * 0.8);
  }
  throw new Error("too big");
}
function setPending(p){
  pending = p;
  $("previewImg").src = p.url;
  $("preview").classList.remove("hidden");
}
function clearPending(){
  pending = null;
  $("preview").classList.add("hidden");
  $("previewImg").removeAttribute("src");
}
$("attachBtn").addEventListener("click", () => $("fileInput").click());
$("previewX").addEventListener("click", clearPending);
$("fileInput").addEventListener("change", async () => {
  const f = $("fileInput").files[0];
  $("fileInput").value = "";
  if (!f) return;
  if (!f.type.startsWith("image/")){ flash("Images only"); return; }
  try{
    setPending(await compressImage(f));
  }catch(e){
    flash("Photo failed");
  }
});

async function downloadImage(src, name){
  try{
    const blob = await (await fetch(src)).blob();
    const u = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = u; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 3000);
  }catch(e){
    const a = document.createElement("a");
    a.href = src; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
  }
}
let viewerMsg = null;
function openViewer(m){
  viewerMsg = m;
  $("vimg").src = m.image;
  $("viewer").classList.remove("hidden");
}
function closeViewer(){
  viewerMsg = null;
  $("viewer").classList.add("hidden");
  $("vimg").removeAttribute("src");
}
$("vclose").addEventListener("click", closeViewer);
$("vdl").addEventListener("click", () => {
  if (viewerMsg) downloadImage(viewerMsg.image, "KT-" + viewerMsg.id + ".jpg");
});
$("viewer").addEventListener("click", e => { if (e.target === $("viewer")) closeViewer(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeViewer(); });

/* ---------- Send ---------- */
$("sendForm").addEventListener("submit", async e => {
  e.preventDefault();
  const input = $("msgInput");
  const text = input.value.trim();
  const img = pending;
  if ((!text && !img) || !currentUser) return;
  input.value = "";
  clearPending();
  try{
    const data = {
      text,
      uid: currentUser.uid,
      username: nameFromEmail(currentUser.email),
      createdAt: Date.now(),
      seenAt: null,
      reactions: {}
    };
    if (img){ data.image = img.url; data.iw = img.w; data.ih = img.h; }
    await addDoc(collection(db, "messages"), data);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }catch(err){
    input.value = text;
    if (img) setPending(img);
    flash("Send failed");
  }
  input.focus();
});
</script>
